else if(a==='pinfo'){await hist(view.p,'','تعديل بيانات البرنامج','','الرابط / قاعدة البيانات / بيانات الدخول');await db.doc('programs/'+view.p).update({url:v('#pu')||'',db:v('#pd2')||'',login:$('#plg').value})}

else if(a==='pren'&&v('#pn')){await hist(view.p,'','إعادة تسمية برنامج',P[view.p].name,v('#pn'));await db.doc('programs/'+view.p).update({name:v('#pn')})}

else if(a==='au'){const n=v('#un'),p=v('#up');if(!n||!/^\d{4}$/.test(p)){await alert2('اكتب الاسم وكلمة سر من 4 أرقام');return}if(Object.values(U).some(u=>norm(u.name)===norm(n))){await alert2('الاسم موجود');return}await db.collection('users').add({name:n,pin:p,role:$('#ur').value,progs:[],pv:[],plan:false})}
else if(a==='arl'){const n=v('#rn'),b=$('#rb').value;if(!n)return;if(allRoles().some(z=>norm(z[1])===norm(n))){await alert2('اسم الدور موجود');return}await cfgSave({roles:[...(CFG.roles||[]),{k:'r'+Date.now().toString(36),n,base:b}]})}

function slDialog(uid,pid){const p=P[pid],u=U[uid];if(!p||!u)return;const cur0=new Set((u.sl&&u.sl[pid])||[]),o=document.createElement('div');o.className='ov';o.style.zIndex=95;
o.innerHTML=`<div class="md" role="dialog" aria-modal="true" style="max-width:640px"><div class="mh"><div><b style="font-size:17px">الشاشات الظاهرة لـ ${esc(u.name)}</b><div class="m">${esc(p.name)} · بدون تحديد = يرى كل الشاشات</div></div><button class="gh" data-sx="x" aria-label="إغلاق">${ic('x',16)}</button></div><div class="mb">${Object.entries(p.menus||{}).map(([m,xs])=>`<div style="margin-top:10px"><label><input type="checkbox" data-sm="${esc(m)}"> <b>${esc(m)}</b></label></div>${xs.map(x=>`<label style="display:block;padding-inline-start:24px"><input type="checkbox" data-sk="${esc(m+'|'+x)}" ${cur0.has(m+'|'+x)?'checked':''}> ${esc(x)}</label>`).join('')}`).join('')}</div><div class="row" style="padding:12px 20px;justify-content:flex-end"><button data-sx="x">إلغاء</button><button class="pb" data-sx="ok">حفظ</button></div></div>`;

const imgData=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const z=128,c=document.createElement('canvas');c.width=c.height=z;const x=c.getContext('2d'),k=Math.max(z/im.width,z/im.height),w=im.width*k,h=im.height*k;x.drawImage(im,(z-w)/2,(z-h)/2,w,h);ok(c.toDataURL('image/png'))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(f)});

else if(t.dataset.e){const e=E.find(x=>x.id===t.dataset.e),f=t.dataset.f,x={[f]:t.value};let lg=false;
if(f==='status'){if(!allowed(e).includes(t.value)){await alert2('هذا الانتقال غير مسموح لدورك أو لحالة الملاحظة');draw();return}if(t.value==='مغلق'&&!can('rt')){await alert2('الإغلاق يتم عبر إعادة الاختبار فقط');draw();return}

x.orig=e.orig||e.dev||t.value;if(had)x.fup=fp;if(!had&&e.status==='جديد')x.status='مسند';
await db.collection('assigns').add({issue:e.id,pid:e.pid,from:e.dev||'',to:t.value,by:cur,reason:r,policy:fp?'retain':'release',first:!had,at:Date.now()});await hist(e.pid,e.id,had?'تفويض — '+r:'إسناد',nm(e.dev),nm(t.value));lg=true}
await db.doc('entries/'+e.id).update(x);if(!lg)hist(e.pid,e.id,f,e[f],t.value)}
else if(t.dataset.u){const u=U[t.dataset.u],f=t.dataset.f;let x={};
if(f==='pin'){if(!/^\d{4}$/.test(t.value)){await alert2('4 أرقام فقط');t.value=u.pin;return}x.pin=t.value}else if(f==='name'){if(!t.value.trim()){t.value=u.name;return}x.name=t.value.trim()}else if(f==='role')x.role=t.value;else if(FL.some(z=>z[0]===f))x[f]=t.checked;
else{const s=new Set(u[f==='pv'?'pv':'progs']||[]);t.checked?s.add(t.dataset.p):s.delete(t.dataset.p);x[f==='pv'?'pv':'progs']=[...s]}
